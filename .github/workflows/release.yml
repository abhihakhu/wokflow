name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: WokFlow ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for what's new.

            **macOS:** the app isn't notarized yet. After dragging it to Applications, right-click it and choose **Open** the first time (or run `xattr -cr /Applications/WokFlow.app`).
            **Windows:** SmartScreen may warn about an unknown publisher; choose **More info → Run anyway**.
            **Android:** download the `.apk` onto your phone and open it; allow installing from your browser or Files app when asked.
          releaseDraft: true
          prerelease: false

  android:
    name: Android APK
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wokflow/mobile sync
      - name: Assemble APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      # Debug-signed so it installs by sideloading; a Play Store build would need a release keystore.
      - name: Attach APK to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "wokflow-${GITHUB_REF_NAME}-android.apk"
          gh release upload "$GITHUB_REF_NAME" "wokflow-${GITHUB_REF_NAME}-android.apk" --clobber
