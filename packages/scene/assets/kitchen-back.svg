<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2E4F"/>
      <stop offset="0.55" stop-color="#C86A4A"/>
      <stop offset="1" stop-color="#F0B66E"/>
    </linearGradient>
    <pattern id="lattice" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4A271B"/>
      <path d="M0 20h12v-8h16v8h12M20 0v12M20 28v12M12 20v8h16v-8" stroke="#2A140D" stroke-width="4" fill="none"/>
    </pattern>
    <pattern id="tiles" width="36" height="22" patternUnits="userSpaceOnUse">
      <rect width="36" height="22" fill="#2B2F36"/>
      <path d="M0 22 q18 -18 36 0" fill="#3A4049" stroke="#1E2126" stroke-width="2"/>
    </pattern>
    <clipPath id="moonGate"><circle cx="560" cy="400" r="270"/></clipPath>
  </defs>

  <!-- wall -->
  <rect width="1600" height="1000" fill="#4A271B"/>
  <rect x="0" y="80" width="1600" height="560" fill="url(#lattice)" opacity="0.55"/>

  <!-- moon-gate window: dusk over ink-wash mountains -->
  <g clip-path="url(#moonGate)">
    <rect x="280" y="120" width="560" height="560" fill="url(#dusk)"/>
    <circle cx="660" cy="300" r="46" fill="#FBE7C2" opacity="0.9"/>
    <path d="M280 470 C330 300 360 300 400 440 C430 330 470 240 520 420 C560 300 600 330 640 440 C680 360 720 280 780 450 L840 460 L840 680 L280 680 Z" fill="#7A4E5E" opacity="0.75"/>
    <path d="M280 520 C320 400 370 420 420 510 C470 400 520 380 560 500 C610 410 660 430 700 520 C740 450 800 440 840 520 L840 680 L280 680 Z" fill="#5A3A4C"/>
    <g fill="#3B2635">
      <rect x="702" y="408" width="12" height="70"/>
      <path d="M690 412 h36 l-18 -18z"/>
      <path d="M692 440 h32 l-16 -14z"/>
      <path d="M694 466 h28 l-14 -12z"/>
    </g>
    <rect x="280" y="560" width="560" height="120" fill="#C98A5E" opacity="0.55"/>
    <rect x="280" y="560" width="560" height="6" fill="#F3C68A" opacity="0.6"/>
    <path d="M470 600 q40 18 80 0 l-8 10 h-64z" fill="#3B2635"/>
    <line x1="510" y1="600" x2="510" y2="560" stroke="#3B2635" stroke-width="3"/>
    <path d="M512 562 l24 30 h-24z" fill="#EFD9B4"/>
    <path d="M300 540 q120 -30 260 -6 q140 22 280 -10" stroke="#FFF2DA" stroke-width="18" fill="none" opacity="0.25" stroke-linecap="round"/>
  </g>
  <circle cx="560" cy="400" r="270" fill="none" stroke="#8E2A22" stroke-width="26"/>
  <circle cx="560" cy="400" r="284" fill="none" stroke="#C9A24A" stroke-width="4"/>
  <circle cx="560" cy="400" r="256" fill="none" stroke="#C9A24A" stroke-width="3"/>

  <!-- roof eave and beam -->
  <rect x="0" y="0" width="1600" height="84" fill="url(#tiles)"/>
  <rect x="0" y="76" width="1600" height="22" fill="#8E2A22"/>
  <rect x="0" y="96" width="1600" height="6" fill="#C9A24A"/>
  <g fill="#5C3020">
    <path d="M200 102 h60 v14 h-12 v10 h-36 v-10 h-12z"/>
    <path d="M900 102 h60 v14 h-12 v10 h-36 v-10 h-12z"/>
    <path d="M1380 102 h60 v14 h-12 v10 h-36 v-10 h-12z"/>
  </g>

  <!-- pillars -->
  <rect x="60" y="102" width="56" height="560" fill="#8E2A22"/>
  <rect x="56" y="180" width="64" height="10" fill="#C9A24A"/>
  <rect x="56" y="560" width="64" height="10" fill="#C9A24A"/>
  <rect x="1500" y="102" width="56" height="560" fill="#8E2A22"/>
  <rect x="1496" y="180" width="64" height="10" fill="#C9A24A"/>
  <rect x="1496" y="560" width="64" height="10" fill="#C9A24A"/>

  <!-- chili and garlic strings -->
  <line x1="1120" y1="110" x2="1120" y2="150" stroke="#C9B394" stroke-width="2"/>
  <path d="M1120 150 c-10 30 10 60 0 90 c-8 26 8 56 0 84" stroke="#7A5A3A" stroke-width="4" fill="none"/>
  <g fill="#C8362B">
    <path d="M1108 170 q-14 22 -2 40 q6 -18 10 -36z"/>
    <path d="M1132 196 q14 22 2 40 q-6 -18 -10 -36z"/>
    <path d="M1108 228 q-14 22 -2 40 q6 -18 10 -36z"/>
    <path d="M1132 254 q14 22 2 40 q-6 -18 -10 -36z"/>
    <path d="M1110 284 q-12 20 0 36 q4 -16 8 -32z"/>
  </g>
  <line x1="1200" y1="110" x2="1200" y2="140" stroke="#C9B394" stroke-width="2"/>
  <g fill="#EFE3C8" stroke="#C9B394" stroke-width="2">
    <circle cx="1200" cy="160" r="16"/>
    <circle cx="1196" cy="194" r="15"/>
    <circle cx="1204" cy="226" r="14"/>
  </g>

  <!-- shelf with porcelain -->
  <rect x="880" y="380" width="300" height="12" fill="#5C3020"/>
  <path d="M904 380 q0 -46 26 -52 q26 6 26 52z" fill="#EFE8DA"/>
  <path d="M912 352 q18 8 36 0" stroke="#2F5D9A" stroke-width="4" fill="none"/>
  <path d="M918 368 h24" stroke="#2F5D9A" stroke-width="3"/>
  <rect x="920" y="322" width="20" height="8" rx="3" fill="#2F5D9A"/>
  <path d="M980 380 q-4 -60 30 -66 q34 6 30 66z" fill="#EFE8DA"/>
  <path d="M988 344 q22 12 44 0" stroke="#2F5D9A" stroke-width="5" fill="none"/>
  <circle cx="1010" cy="360" r="8" fill="none" stroke="#2F5D9A" stroke-width="3"/>
  <path d="M1070 380 v-34 q0 -10 10 -10 h40 q10 0 10 10 v34z" fill="#6B8F5E"/>
  <path d="M1130 352 q22 -4 22 18" stroke="#6B8F5E" stroke-width="6" fill="none"/>
  <rect x="1088" y="326" width="24" height="10" rx="4" fill="#4F6E45"/>
</svg>
